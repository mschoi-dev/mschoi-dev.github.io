<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Photo archive by Minseok Choi.">
  <title>Photos — Minseok Choi</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232456d6'/%3E%3Ctext x='32' y='42' font-family='Segoe UI,sans-serif' font-size='26' font-weight='700' fill='white' text-anchor='middle'%3EMC%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="nav-logo">Minseok Choi</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="projects.html">Projects</a>
      <a href="downloads.html">Downloads</a>
      <a href="notes.html">Notes</a>
      <a href="photos.html" class="active">Photos</a>
      <a href="contact.html">Contact</a>
      <a href="login.html" class="nav-signin">Sign in</a>
    </div>
  </nav>

  <main class="ig-main">
    <section class="section">
      <div class="page-head">
        <h1 class="page-title">Photos</h1>
        <div id="upload-area"></div>
      </div>
      <p class="page-desc">Moments worth keeping. Sign in to like and comment.</p>

      <div class="list-controls">
        <div class="cat-tabs" id="tag-bar"></div>
        <select class="sort-select" id="sort">
          <option value="new">Newest</option>
          <option value="liked">Most liked</option>
          <option value="viewed">Most viewed</option>
        </select>
      </div>

      <div class="ig-grid" id="grid"><p class="empty-state">Loading…</p></div>
    </section>
  </main>

  <!-- Create post modal (Instagram-style) -->
  <div class="ig-modal" id="create-modal" hidden>
    <div class="ig-modal-backdrop" id="create-close-bg"></div>
    <div class="ig-create-box">
      <div class="ig-create-head">
        <button class="ig-create-cancel" id="create-cancel" type="button">Cancel</button>
        <strong>Create new post</strong>
        <button class="ig-create-share" id="create-share" type="button" disabled>Share</button>
      </div>
      <div class="ig-create-body">
        <div class="ig-create-media" id="create-drop">
          <div class="ig-create-placeholder" id="create-placeholder">
            <svg width="76" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="2" y="4" width="20" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m22 16-5-5-9 9"/></svg>
            <p>Drag a photo here</p>
            <button class="btn btn-primary" id="create-select" type="button">Select from computer</button>
            <input type="file" id="create-file" accept="image/*" hidden>
          </div>
          <img id="create-preview" alt="" hidden>
        </div>
        <div class="ig-create-side">
          <p class="ig-create-user"><strong>Minseok Choi</strong></p>
          <textarea id="create-caption" maxlength="2000" placeholder="Write a caption…"></textarea>
          <input type="text" id="create-tags" class="dlg-input" maxlength="200"
                 placeholder="Tags — comma separated (e.g. gear-studio, travel)">
          <p class="hint" id="create-msg"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Detail modal -->
  <div class="ig-modal" id="modal" hidden>
    <div class="ig-modal-backdrop" id="modal-close-bg"></div>
    <div class="ig-modal-box">
      <button class="ig-modal-close" id="modal-close">×</button>
      <div class="ig-modal-img"><img id="modal-img" src="" alt=""></div>
      <div class="ig-modal-side">
        <div class="ig-caption" id="modal-caption"></div>
        <div class="ig-comments" id="modal-comments"></div>
        <div class="ig-actions">
          <button class="ig-like" id="like-btn">♡</button>
          <span id="like-count" class="hint"></span>
          <span id="modal-admin" class="ig-admin-slot"></span>
        </div>
        <form class="ig-comment-form" id="comment-form">
          <input type="text" id="comment-input" maxlength="1000" placeholder="Add a comment…">
          <button type="submit" class="btn" id="comment-btn">Post</button>
        </form>
        <p class="hint" id="modal-msg"></p>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>© 2026 Minseok Choi · <a href="https://github.com/mschoi-dev">GitHub</a> · <a href="privacy.html">Privacy</a></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/site-auth.js"></script>
  <script src="js/image-utils.js"></script>
  <script>
    let me = null;            // { id, name, approved, admin }
    let posts = [];
    let curTag = 'all';
    let likeMap = {};         // photo_id -> count
    let myLikes = new Set();  // photo_ids I liked
    let commentMap = {};      // photo_id -> count
    let current = null;       // post shown in modal

    const $ = id => document.getElementById(id);
    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s == null ? '' : String(s);
      return d.innerHTML;
    }
    const publicUrl = path => sb.storage.from('photos').getPublicUrl(path).data.publicUrl;

    async function loadSession() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { me = null; return; }
      const { data: p } = await sb.from('profiles')
        .select('full_name, status, role').eq('id', session.user.id).single();
      me = p ? {
        id: session.user.id, name: p.full_name,
        approved: p.status === 'approved', admin: p.role === 'admin'
      } : null;
    }

    async function loadData() {
      const [{ data: ps }, { data: ls }, { data: cs }] = await Promise.all([
        sb.from('photo_posts').select('*').order('created_at', { ascending: false }),
        sb.from('photo_likes').select('photo_id, user_id'),
        sb.from('photo_comments').select('photo_id')
      ]);
      posts = ps || [];
      likeMap = {}; myLikes = new Set(); commentMap = {};
      (ls || []).forEach(l => {
        likeMap[l.photo_id] = (likeMap[l.photo_id] || 0) + 1;
        if (me && l.user_id === me.id) myLikes.add(l.photo_id);
      });
      (cs || []).forEach(c => { commentMap[c.photo_id] = (commentMap[c.photo_id] || 0) + 1; });
    }

    function renderGrid() {
      const grid = $('grid');
      if (posts.length === 0) {
        grid.innerHTML = '<p class="empty-state">First photos coming soon.</p>';
        return;
      }
      const s = $('sort').value;
      const filtered = curTag === 'all' ? posts : posts.filter(p => (p.tags || []).includes(curTag));
      if (!filtered.length) {
        grid.innerHTML = '<p class="empty-state">No photos with this tag yet.</p>';
        return;
      }
      const sorted = filtered.slice().sort((a, b) =>
        s === 'liked'  ? (likeMap[b.id] || 0) - (likeMap[a.id] || 0) :
        s === 'viewed' ? (b.views || 0) - (a.views || 0) :
                         new Date(b.created_at) - new Date(a.created_at));
      grid.innerHTML = sorted.map(p => `
        <button class="ig-cell" data-id="${p.id}">
          <img src="${publicUrl(p.thumb_path || p.image_path)}" alt="" loading="lazy">
          <span class="ig-overlay"><span>♥ ${likeMap[p.id] || 0}</span><span>💬 ${commentMap[p.id] || 0}</span></span>
        </button>`).join('');
      grid.querySelectorAll('.ig-cell').forEach(c =>
        c.addEventListener('click', () => openModal(posts.find(p => p.id == c.dataset.id))));
    }

    function renderTagBar() {
      const bar = $('tag-bar');
      const tags = [...new Set(posts.flatMap(p => p.tags || []))].sort();
      if (!tags.length) { bar.innerHTML = ''; return; }
      bar.innerHTML =
        `<button class="cat-tab ${curTag === 'all' ? 'active' : ''}" data-tag="all">All</button>` +
        tags.map(t => `<button class="cat-tab ${curTag === t ? 'active' : ''}" data-tag="${esc(t)}">#${esc(t)}</button>`).join('');
      bar.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
        curTag = b.dataset.tag;
        renderTagBar(); renderGrid();
      }));
    }

    // --- Create post (Instagram-style modal) ---
    let createFile = null;

    function renderUpload() {
      if (!me || !me.admin) { $('upload-area').innerHTML = ''; return; }
      $('upload-area').innerHTML = `
        <button class="ig-add-btn" id="add-btn" type="button" title="New post" aria-label="New post">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg>
        </button>`;
      $('add-btn').addEventListener('click', openCreate);
    }

    function openCreate() {
      resetCreate();
      $('create-modal').hidden = false;
      document.body.style.overflow = 'hidden';
    }

    function closeCreate() {
      $('create-modal').hidden = true;
      document.body.style.overflow = '';
      resetCreate();
    }

    function resetCreate() {
      createFile = null;
      $('create-preview').hidden = true;
      $('create-preview').src = '';
      $('create-placeholder').hidden = false;
      $('create-caption').value = '';
      $('create-tags').value = '';
      $('create-msg').textContent = '';
      $('create-share').disabled = true;
      $('create-file').value = '';
    }

    function setCreateFile(file) {
      if (!file || !file.type.startsWith('image/')) return;
      if (file.size > 50 * 1024 * 1024) {
        $('create-msg').textContent = 'Max file size is 50 MB.';
        return;
      }
      createFile = file;
      const reader = new FileReader();
      reader.onload = () => {
        $('create-preview').src = reader.result;
        $('create-preview').hidden = false;
        $('create-placeholder').hidden = true;
        $('create-share').disabled = false;
        $('create-msg').textContent = '';
      };
      reader.readAsDataURL(file);
    }

    $('create-select').addEventListener('click', () => $('create-file').click());
    $('create-file').addEventListener('change', () => setCreateFile($('create-file').files[0]));
    $('create-cancel').addEventListener('click', closeCreate);
    $('create-close-bg').addEventListener('click', closeCreate);

    const drop = $('create-drop');
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('dragging'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('dragging'));
    drop.addEventListener('drop', e => {
      e.preventDefault(); drop.classList.remove('dragging');
      setCreateFile(e.dataTransfer.files[0]);
    });

    $('create-share').addEventListener('click', async () => {
      if (!createFile) return;
      $('create-share').disabled = true;
      $('create-msg').textContent = 'Optimizing image…';
      const web = await compressImage(createFile, 2560, 0.88);
      const thumb = await compressImage(createFile, 640, 0.8);
      $('create-msg').textContent = 'Sharing… (large files can take a while)';
      const stamp = Date.now();
      const safe = web.name.replace(/[^\w.\-]/g, '_');
      const path = `archive/${stamp}_${safe}`;
      const thumbPath = `thumbs/${stamp}_${safe}`;
      const { error: upErr } = await sb.storage.from('photos').upload(path, web);
      if (upErr) {
        $('create-msg').textContent = 'Upload failed: ' + upErr.message;
        $('create-share').disabled = false; return;
      }
      const { error: thErr } = await sb.storage.from('photos').upload(thumbPath, thumb);
      const tags = [...new Set($('create-tags').value.split(',')
        .map(t => t.trim().toLowerCase().replace(/^#/, ''))
        .filter(Boolean))];
      const { error: insErr } = await sb.from('photo_posts')
        .insert({ image_path: path, thumb_path: thErr ? null : thumbPath,
                  caption: $('create-caption').value.trim() || null, tags });
      if (insErr) {
        $('create-msg').textContent = 'Save failed: ' + insErr.message;
        $('create-share').disabled = false; return;
      }
      closeCreate();
      await loadData(); renderTagBar(); renderGrid();
    });

    async function loadComments(photoId) {
      const { data: cs } = await sb.from('photo_comments')
        .select('*').eq('photo_id', photoId).order('created_at', { ascending: true });
      const box = $('modal-comments');
      if (!cs || cs.length === 0) { box.innerHTML = '<p class="hint">No comments yet.</p>'; return; }
      box.innerHTML = cs.map(c => `
        <p class="ig-comment">
          <strong>${esc(c.author_name)}</strong> ${esc(c.content)}
          ${(me && (c.author_id === me.id || me.admin))
            ? `<a href="#" class="c-del hint" data-id="${c.id}">delete</a>` : ''}
        </p>`).join('');
      box.querySelectorAll('.c-del').forEach(a => a.addEventListener('click', async (e) => {
        e.preventDefault();
        await sb.from('photo_comments').delete().eq('id', a.dataset.id);
        commentMap[photoId] = Math.max(0, (commentMap[photoId] || 1) - 1);
        loadComments(photoId); renderGrid();
      }));
    }

    function refreshLikeUI() {
      $('like-btn').textContent = myLikes.has(current.id) ? '♥' : '♡';
      $('like-btn').classList.toggle('liked', myLikes.has(current.id));
      const n = likeMap[current.id] || 0;
      $('like-count').textContent = n === 1 ? '1 like' : `${n} likes`;
    }

    function openModal(post, bump = true) {
      current = post;
      if (bump) {
        post.views = (post.views || 0) + 1;
        sb.rpc('bump_photo_views', { p_id: post.id });
      }
      $('modal-img').src = publicUrl(post.image_path);
      const tagHtml = (post.tags || []).length
        ? `<br><span class="ig-tag-line">${post.tags.map(t =>
            `<a href="#" class="ig-tag" data-tag="${esc(t)}">#${esc(t)}</a>`).join(' ')}</span>` : '';
      $('modal-caption').innerHTML =
        `<strong>Minseok Choi</strong> ${esc(post.caption || '')}${tagHtml}<br>
         <span class="hint">${new Date(post.created_at).toLocaleDateString()} · ${post.views} views</span>`;
      $('modal-caption').querySelectorAll('.ig-tag').forEach(a => a.addEventListener('click', (e) => {
        e.preventDefault();
        curTag = a.dataset.tag;
        closeModal();
        renderTagBar(); renderGrid();
      }));
      $('modal-admin').innerHTML = (me && me.admin)
        ? `<a href="#" id="post-edit" class="hint">edit</a> ·
           <a href="#" id="post-del" class="hint">delete post</a>` : '';
      $('modal-msg').textContent = '';
      $('comment-form').style.display = (me && me.approved) ? '' : 'none';
      if (!me) $('modal-msg').innerHTML = '<a href="login.html">Sign in</a> to like and comment.';
      else if (!me.approved) $('modal-msg').textContent = 'Likes and comments open once your account is approved.';
      refreshLikeUI();
      loadComments(post.id);
      $('modal').hidden = false;
      document.body.style.overflow = 'hidden';

      const del = $('post-del');
      if (del) del.onclick = async (e) => {
        e.preventDefault();
        if (!confirm('Delete this photo post?')) return;
        await sb.from('photo_posts').delete().eq('id', current.id);
        const rm = [current.image_path];
        if (current.thumb_path) rm.push(current.thumb_path);
        await sb.storage.from('photos').remove(rm);
        closeModal();
        await loadData(); renderTagBar(); renderGrid();
      };

      const ed = $('post-edit');
      if (ed) ed.onclick = (e) => {
        e.preventDefault();
        $('modal-caption').innerHTML = `
          <textarea id="edit-cap" class="dlg-text dlg-text-sm"
            placeholder="Caption…">${esc(post.caption || '')}</textarea>
          <input type="text" id="edit-tags" class="dlg-input" style="margin-top:0.5rem"
            value="${esc((post.tags || []).join(', '))}" placeholder="tags, comma separated">
          <div class="hero-actions" style="margin-top:0.6rem">
            <button class="btn btn-primary" id="edit-save">Save</button>
            <button class="btn" id="edit-cancel">Cancel</button>
          </div>`;
        $('edit-cancel').onclick = () => openModal(post, false);
        $('edit-save').onclick = async () => {
          const caption = $('edit-cap').value.trim() || null;
          const tags = [...new Set($('edit-tags').value.split(',')
            .map(t => t.trim().toLowerCase().replace(/^#/, '')).filter(Boolean))];
          const { error } = await sb.from('photo_posts')
            .update({ caption, tags }).eq('id', post.id);
          if (error) { $('modal-msg').textContent = 'Save failed: ' + error.message; return; }
          post.caption = caption; post.tags = tags;
          renderTagBar(); renderGrid();
          openModal(post, false);
        };
      };
    }

    function closeModal() {
      $('modal').hidden = true;
      document.body.style.overflow = '';
      current = null;
    }

    $('modal-close').addEventListener('click', closeModal);
    $('modal-close-bg').addEventListener('click', closeModal);
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      if (current) closeModal();
      else if (!$('create-modal').hidden) closeCreate();
    });

    $('like-btn').addEventListener('click', async () => {
      if (!me) { $('modal-msg').innerHTML = '<a href="login.html">Sign in</a> to like photos.'; return; }
      if (!me.approved) { $('modal-msg').textContent = 'Likes open once your account is approved.'; return; }
      if (myLikes.has(current.id)) {
        await sb.from('photo_likes').delete().eq('photo_id', current.id).eq('user_id', me.id);
        myLikes.delete(current.id);
        likeMap[current.id] = Math.max(0, (likeMap[current.id] || 1) - 1);
      } else {
        const { error } = await sb.from('photo_likes').insert({ photo_id: current.id, user_id: me.id });
        if (!error) { myLikes.add(current.id); likeMap[current.id] = (likeMap[current.id] || 0) + 1; }
      }
      refreshLikeUI(); renderGrid();
    });

    $('comment-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = $('comment-input');
      const text = input.value.trim();
      if (!text || !me || !me.approved) return;
      $('comment-btn').disabled = true;
      const { error } = await sb.from('photo_comments')
        .insert({ photo_id: current.id, author_id: me.id, author_name: me.name, content: text });
      if (!error) {
        input.value = '';
        commentMap[current.id] = (commentMap[current.id] || 0) + 1;
        loadComments(current.id); renderGrid();
      } else {
        $('modal-msg').textContent = 'Comment failed: ' + error.message;
      }
      $('comment-btn').disabled = false;
    });

    $('sort').addEventListener('change', renderGrid);

    (async () => {
      await loadSession();
      await loadData();
      renderUpload();
      renderTagBar();
      renderGrid();
      const target = new URLSearchParams(location.search).get('photo');
      if (target) {
        const p = posts.find(x => x.id == target);
        if (p) openModal(p);
      }
    })();
  </script>
</body>
</html>
