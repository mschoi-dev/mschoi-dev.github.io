<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Projects by Minseok Choi — desktop tools, simulators, and web apps.">
  <title>Projects — Minseok Choi</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232456d6'/%3E%3Ctext x='32' y='42' font-family='Segoe UI,sans-serif' font-size='26' font-weight='700' fill='white' text-anchor='middle'%3EMC%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="nav-logo">Minseok Choi</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="projects.html" class="active">Projects</a>
      <a href="downloads.html">Downloads</a>
      <a href="notes.html">Notes</a>
      <a href="photos.html">Photos</a>
      <a href="contact.html">Contact</a>
      <a href="login.html" class="nav-signin">Sign in</a>
    </div>
  </nav>

  <main>
    <section class="section">
      <div class="page-head">
        <div>
          <h1 class="page-title">Projects</h1>
          <p class="page-desc">Software I designed and built end-to-end. Installers are available on the <a href="downloads.html">Downloads</a> page as they are released.</p>
        </div>
        <div id="add-area"></div>
      </div>

      <div class="list-controls">
        <span></span>
        <select class="sort-select" id="sort">
          <option value="new">Newest</option>
          <option value="old">Oldest</option>
        </select>
      </div>

      <div id="project-list"><p class="empty-state">Loading…</p></div>
    </section>
  </main>

  <!-- Create project modal -->
  <div class="ig-modal" id="create-modal" hidden>
    <div class="ig-modal-backdrop" id="create-close-bg"></div>
    <div class="ig-create-box dlg">
      <div class="ig-create-head">
        <button class="ig-create-cancel" id="create-cancel" type="button">Cancel</button>
        <strong>New project</strong>
        <button class="ig-create-share" id="create-share" type="button" disabled>Share</button>
      </div>
      <div class="dlg-body">
        <input type="text" id="p-title" class="dlg-input" maxlength="200" placeholder="Title">
        <input type="text" id="p-meta" class="dlg-input" maxlength="200" placeholder="Meta (e.g. Desktop App · PySide6 · Offline)">
        <textarea id="p-desc" class="dlg-text" maxlength="5000" placeholder="Describe the project…"></textarea>
        <p class="hint" id="create-msg"></p>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>© 2026 Minseok Choi · <a href="https://github.com/mschoi-dev">GitHub</a> · <a href="privacy.html">Privacy</a></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/site-auth.js"></script>
  <script>
    let projects = [], isAdmin = false;
    const $ = id => document.getElementById(id);
    function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

    function renderList() {
      const list = $('project-list');
      const s = $('sort').value;
      const rows = projects.slice().sort((a, b) =>
        s === 'old' ? a.id - b.id : b.id - a.id);
      if (!rows.length) { list.innerHTML = '<p class="empty-state">No projects yet.</p>'; return; }
      list.innerHTML = rows.map(p => `
        <article class="project" id="p-${p.id}">
          <h2>${esc(p.title)}</h2>
          <p class="project-meta">${esc(p.meta || '')}</p>
          <p>${esc(p.description)}</p>
          ${isAdmin ? `<p class="hint"><a href="#" class="pj-del" data-id="${p.id}">delete</a></p>` : ''}
        </article>`).join('');
      list.querySelectorAll('.pj-del').forEach(a => a.addEventListener('click', async (e) => {
        e.preventDefault();
        if (!confirm('Delete this project?')) return;
        await sb.from('projects_posts').delete().eq('id', a.dataset.id);
        load();
      }));
    }

    async function load() {
      const { data } = await sb.from('projects_posts').select('*');
      projects = data || [];
      renderList();
    }

    $('sort').addEventListener('change', renderList);

    function updateShareState() {
      $('create-share').disabled = !($('p-title').value.trim() && $('p-desc').value.trim());
    }
    ['p-title', 'p-desc'].forEach(id => $(id).addEventListener('input', updateShareState));

    function closeCreate() {
      $('create-modal').hidden = true; document.body.style.overflow = '';
      $('p-title').value = ''; $('p-meta').value = ''; $('p-desc').value = '';
      $('create-msg').textContent = ''; updateShareState();
    }
    $('create-cancel').addEventListener('click', closeCreate);
    $('create-close-bg').addEventListener('click', closeCreate);
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('create-modal').hidden) closeCreate(); });

    $('create-share').addEventListener('click', async () => {
      $('create-share').disabled = true;
      $('create-msg').textContent = 'Sharing…';
      const { error } = await sb.from('projects_posts').insert({
        title: $('p-title').value.trim(),
        meta: $('p-meta').value.trim() || null,
        description: $('p-desc').value.trim()
      });
      if (error) { $('create-msg').textContent = 'Failed: ' + error.message; $('create-share').disabled = false; return; }
      closeCreate();
      load();
    });

    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        const { data: p } = await sb.from('profiles').select('role').eq('id', session.user.id).single();
        if (p && p.role === 'admin') {
          isAdmin = true;
          $('add-area').innerHTML = `
            <button class="ig-add-btn" id="add-btn" type="button" title="New project" aria-label="New project">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg>
            </button>`;
          $('add-btn').addEventListener('click', () => {
            $('create-modal').hidden = false; document.body.style.overflow = 'hidden';
          });
        }
      }
      load();
    })();
  </script>
</body>
</html>
