<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Member community — share thoughts and photos.">
  <title>Community — Minseok Choi</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232456d6'/%3E%3Ctext x='32' y='42' font-family='Segoe UI,sans-serif' font-size='26' font-weight='700' fill='white' text-anchor='middle'%3EMC%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="nav-logo">Minseok Choi</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="projects.html">Projects</a>
      <a href="downloads.html">Downloads</a>
      <a href="notes.html">Notes</a>
      <a href="journal.html">Journal</a>
      <a href="photos.html">Photos</a>
      <a href="community.html" class="active">Community</a>
      <a href="contact.html">Contact</a>
      <a href="login.html" class="nav-signin">Sign in</a>
    </div>
  </nav>

  <main>
    <section class="section">
      <h1 class="page-title">Community</h1>
      <p class="page-desc">A space for approved members to talk and share photos.</p>

      <div id="auth-area">
        <p class="empty-state">Checking your session…</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>© 2026 Minseok Choi · <a href="https://github.com/mschoi-dev">GitHub</a> · <a href="privacy.html">Privacy</a></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/site-auth.js"></script>
  <script>
    const area = document.getElementById('auth-area');
    let me = null;

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s == null ? '' : String(s);
      return d.innerHTML;
    }

    async function loadFeed() {
      const { data: posts, error } = await sb
        .from('community_posts')
        .select('*')
        .order('created_at', { ascending: false })
        .limit(50);

      const feed = document.getElementById('feed');
      if (error) { feed.innerHTML = `<p class="form-msg error">Could not load posts.</p>`; return; }
      if (!posts || posts.length === 0) {
        feed.innerHTML = `<p class="empty-state">No posts yet — be the first to write something!</p>`;
        return;
      }

      const html = await Promise.all(posts.map(async p => {
        let img = '';
        if (p.image_path) {
          const { data } = await sb.storage.from('community').createSignedUrl(p.image_path, 3600);
          if (data) img = `<img class="post-img" src="${data.signedUrl}" alt="" loading="lazy">`;
        }
        const mine = me && p.author_id === me.id;
        return `
          <div class="post-card">
            <div class="post-head">
              <strong>${esc(p.author_name)}</strong>
              <span class="hint">${new Date(p.created_at).toLocaleString()}</span>
              ${mine ? `<a href="#" class="post-del hint" data-id="${p.id}">delete</a>` : ''}
            </div>
            <p class="post-content">${esc(p.content)}</p>
            ${img}
          </div>`;
      }));
      feed.innerHTML = html.join('');

      feed.querySelectorAll('.post-del').forEach(a => a.addEventListener('click', async (e) => {
        e.preventDefault();
        await sb.from('community_posts').delete().eq('id', a.dataset.id);
        loadFeed();
      }));
    }

    async function render() {
      const { data: { session } } = await sb.auth.getSession();

      if (!session) {
        area.innerHTML = `
          <div class="gate">
            <p>The community is open to approved members. Please sign in.</p>
            <div class="hero-actions">
              <a href="login.html" class="btn btn-primary">Sign in</a>
              <a href="signup.html" class="btn">Sign up</a>
            </div>
          </div>`;
        return;
      }

      const { data: profile } = await sb
        .from('profiles').select('full_name, status').eq('id', session.user.id).single();

      if (!profile) {
        area.innerHTML = `<p class="form-msg error">Could not load your profile.</p>`;
        return;
      }

      if (profile.status !== 'approved') {
        area.innerHTML = `
          <div class="gate">
            <p>⏳ Your account is awaiting approval. The community opens once you are approved.</p>
          </div>
          <p class="note">Signed in as <strong>${esc(profile.full_name)}</strong> · <a href="#" id="signout">Sign out</a></p>`;
      } else {
        me = { id: session.user.id, name: profile.full_name };
        area.innerHTML = `
          <form id="composer" class="form composer">
            <textarea id="post-text" rows="3" maxlength="2000" placeholder="Share something with the community…" required></textarea>
            <div class="composer-bar">
              <input type="file" id="post-image" accept="image/*">
              <button type="submit" class="btn btn-primary" id="post-btn">Post</button>
            </div>
            <p id="post-msg" class="form-msg" role="status"></p>
          </form>
          <div id="feed"><p class="empty-state">Loading posts…</p></div>
          <p class="note">Signed in as <strong>${esc(profile.full_name)}</strong> · <a href="#" id="signout">Sign out</a></p>`;

        document.getElementById('composer').addEventListener('submit', async (e) => {
          e.preventDefault();
          const btn = document.getElementById('post-btn');
          const msg = document.getElementById('post-msg');
          const text = document.getElementById('post-text').value.trim();
          const file = document.getElementById('post-image').files[0];
          if (!text) return;
          btn.disabled = true; msg.textContent = 'Posting…'; msg.className = 'form-msg';

          let image_path = null;
          if (file) {
            if (file.size > 5 * 1024 * 1024) {
              msg.textContent = 'Image too large (max 5 MB).'; msg.className = 'form-msg error';
              btn.disabled = false; return;
            }
            const safe = file.name.replace(/[^\w.\-]/g, '_');
            const path = `${me.id}/${Date.now()}_${safe}`;
            const { error: upErr } = await sb.storage.from('community').upload(path, file);
            if (upErr) {
              msg.textContent = 'Image upload failed: ' + upErr.message; msg.className = 'form-msg error';
              btn.disabled = false; return;
            }
            image_path = path;
          }

          const { error: insErr } = await sb.from('community_posts')
            .insert({ author_id: me.id, author_name: me.name, content: text, image_path });

          if (insErr) {
            msg.textContent = 'Post failed: ' + insErr.message; msg.className = 'form-msg error';
          } else {
            msg.textContent = '';
            document.getElementById('composer').reset();
            loadFeed();
          }
          btn.disabled = false;
        });

        loadFeed();
      }

      const so = document.getElementById('signout');
      if (so) so.addEventListener('click', async (e) => {
        e.preventDefault();
        await sb.auth.signOut();
        render();
      });
    }

    render();
  </script>
</body>
</html>
