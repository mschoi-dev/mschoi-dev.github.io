<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>My Profile — Minseok Choi</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232456d6'/%3E%3Ctext x='32' y='42' font-family='Segoe UI,sans-serif' font-size='26' font-weight='700' fill='white' text-anchor='middle'%3EMC%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="nav-logo">Minseok Choi</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="projects.html">Projects</a>
      <a href="downloads.html">Downloads</a>
      <a href="notes.html">Notes</a>
      <a href="photos.html">Photos</a>
      <a href="contact.html">Contact</a>
      <a href="login.html" class="nav-signin">Sign in</a>
    </div>
  </nav>

  <main>
    <section class="section">
      <h1 class="page-title">My Profile</h1>
      <div id="auth-area"><p class="empty-state">Checking your session…</p></div>
    </section>
  </main>

  <footer class="footer">
    <p>© 2026 Minseok Choi · <a href="https://github.com/mschoi-dev">GitHub</a> · <a href="privacy.html">Privacy</a></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/site-auth.js"></script>
  <script src="js/image-utils.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const area = $('auth-area');
    function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

    const STATUS_BADGE = {
      pending:  '<span class="badge badge-soon">pending approval</span>',
      approved: '<span class="badge badge-ok">approved</span>',
      blocked:  '<span class="badge badge-blocked">blocked</span>'
    };

    let uid = null;

    function avatarBlock(p) {
      if (p.avatar_path) {
        const url = sb.storage.from('avatars').getPublicUrl(p.avatar_path).data.publicUrl;
        return `<img class="profile-avatar" src="${url}" alt="">`;
      }
      return `<span class="profile-avatar profile-avatar-ph">${esc((p.full_name || '?').charAt(0).toUpperCase())}</span>`;
    }

    async function loadActivity(tab) {
      const box = $('activity-box');
      box.innerHTML = '<p class="empty-state">Loading…</p>';

      if (tab === 'posts') {
        const { data: cps } = await sb.from('community_posts')
          .select('id, content, created_at').eq('author_id', uid)
          .order('created_at', { ascending: false }).limit(50);
        const rows = (cps || []).map(p => `
          <a class="post-item" href="community.html?post=${p.id}">
            <span class="post-date">${p.created_at.slice(0, 10)}</span>
            <span class="post-title">${esc((p.content || '(photo post)').slice(0, 80))}</span>
          </a>`);
        box.innerHTML = rows.length ? rows.join('') : '<p class="empty-state">No posts yet.</p>';
      }

      if (tab === 'comments') {
        const [{ data: pc }, { data: cc }] = await Promise.all([
          sb.from('photo_comments').select('photo_id, content, created_at')
            .eq('author_id', uid).order('created_at', { ascending: false }).limit(50),
          sb.from('community_post_comments').select('post_id, content, created_at')
            .eq('author_id', uid).order('created_at', { ascending: false }).limit(50)
        ]);
        const rows = [
          ...(pc || []).map(c => ({ ...c, href: `photos.html?photo=${c.photo_id}`, where: 'Photos' })),
          ...(cc || []).map(c => ({ ...c, href: `community.html?post=${c.post_id}`, where: 'Community' }))
        ].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        box.innerHTML = rows.length ? rows.map(c => `
          <a class="post-item" href="${c.href}">
            <span class="post-date">${c.created_at.slice(0, 10)}</span>
            <span class="post-title">${esc(c.content.slice(0, 80))}</span>
            <span class="cat-badge cat-journal">${c.where}</span>
          </a>`).join('') : '<p class="empty-state">No comments yet.</p>';
      }

      if (tab === 'likes') {
        const [{ data: pl }, { data: cl }] = await Promise.all([
          sb.from('photo_likes').select('photo_id, created_at')
            .eq('user_id', uid).order('created_at', { ascending: false }).limit(50),
          sb.from('community_post_likes').select('post_id, created_at')
            .eq('user_id', uid).order('created_at', { ascending: false }).limit(50)
        ]);
        const rows = [
          ...(pl || []).map(l => ({ ...l, href: `photos.html?photo=${l.photo_id}`, label: 'Photo', where: 'Photos' })),
          ...(cl || []).map(l => ({ ...l, href: `community.html?post=${l.post_id}`, label: 'Post', where: 'Community' }))
        ].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        box.innerHTML = rows.length ? rows.map(l => `
          <a class="post-item" href="${l.href}">
            <span class="post-date">${l.created_at.slice(0, 10)}</span>
            <span class="post-title">♥ ${l.label}</span>
            <span class="cat-badge cat-journal">${l.where}</span>
          </a>`).join('') : '<p class="empty-state">No likes yet.</p>';
      }
    }

    async function render() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        area.innerHTML = `
          <div class="gate">
            <p>Please sign in to view your profile.</p>
            <div class="hero-actions">
              <a href="login.html" class="btn btn-primary">Sign in</a>
              <a href="signup.html" class="btn">Sign up</a>
            </div>
          </div>`;
        return;
      }
      uid = session.user.id;

      const { data: p, error } = await sb.from('profiles').select('*').eq('id', uid).single();
      if (error || !p) { area.innerHTML = `<p class="form-msg error">Could not load your profile.</p>`; return; }

      area.innerHTML = `
        <div class="profile-top">
          <div class="profile-avatar-wrap">
            ${avatarBlock(p)}
            <button type="button" class="btn profile-avatar-btn" id="avatar-btn">Change photo</button>
            <input type="file" id="avatar-file" accept="image/*" hidden>
          </div>
          <div>
            <p class="page-desc" style="margin-bottom:0.4rem">
              ${STATUS_BADGE[p.status] || esc(p.status)}
              ${p.role === 'admin' ? '<span class="badge badge-ok">admin</span>' : ''}
            </p>
            <p class="hint">member since ${new Date(p.created_at).toLocaleDateString()}</p>
            <p class="hint" id="avatar-msg"></p>
          </div>
        </div>

        <form id="profile-form" class="form auth-box">
          <div class="field"><label>Email</label>
            <input type="email" value="${esc(p.email)}" disabled></div>
          <div class="field"><label for="full_name">Full name</label>
            <input type="text" id="full_name" value="${esc(p.full_name)}" required></div>
          <div class="field"><label for="country">Country</label>
            <input type="text" id="country" value="${esc(p.country)}" required></div>
          <div class="field"><label for="origin">Affiliation / Origin</label>
            <input type="text" id="origin" value="${esc(p.origin)}" required></div>
          <div class="field"><label for="phone">Phone <span class="hint">(optional)</span></label>
            <input type="tel" id="phone" value="${esc(p.phone || '')}"></div>
          <button type="submit" class="btn btn-primary" id="save-btn">Save changes</button>
          <p id="form-msg" class="form-msg" role="status"></p>
        </form>

        <h2 class="section-title" style="margin-top:2.5rem">My Activity</h2>
        <div class="cat-tabs">
          <button class="cat-tab active" data-tab="posts">Posts</button>
          <button class="cat-tab" data-tab="comments">Comments</button>
          <button class="cat-tab" data-tab="likes">Likes</button>
        </div>
        <div class="post-list" id="activity-box"></div>

        <p class="note">
          ${p.role === 'admin' ? '<a href="admin.html">Member admin</a> · ' : ''}
          <a href="#" id="signout">Sign out</a>
        </p>`;

      // avatar upload
      $('avatar-btn').onclick = () => $('avatar-file').click();
      $('avatar-file').onchange = async () => {
        let f = $('avatar-file').files[0];
        if (!f) return;
        $('avatar-msg').textContent = 'Uploading…';
        f = await compressImage(f, 512, 0.85);
        if (f.size > 5 * 1024 * 1024) { $('avatar-msg').textContent = 'Max 5 MB.'; return; }
        const safe = f.name.replace(/[^\w.\-]/g, '_');
        const path = `${uid}/${Date.now()}_${safe}`;
        const { error: upErr } = await sb.storage.from('avatars').upload(path, f);
        if (upErr) { $('avatar-msg').textContent = 'Upload failed: ' + upErr.message; return; }
        const { error: uErr } = await sb.from('profiles').update({ avatar_path: path }).eq('id', uid);
        if (uErr) { $('avatar-msg').textContent = 'Save failed: ' + uErr.message; return; }
        render();
      };

      $('profile-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        $('save-btn').disabled = true;
        $('form-msg').textContent = 'Saving…'; $('form-msg').className = 'form-msg';
        const { error: uErr } = await sb.from('profiles').update({
          full_name: $('full_name').value.trim(),
          country: $('country').value.trim(),
          origin: $('origin').value.trim(),
          phone: $('phone').value.trim() || null
        }).eq('id', uid);
        $('form-msg').textContent = uErr ? 'Save failed: ' + uErr.message : '✓ Saved.';
        $('form-msg').className = uErr ? 'form-msg error' : 'form-msg ok';
        $('save-btn').disabled = false;
      });

      area.querySelectorAll('.cat-tab').forEach(t => t.addEventListener('click', () => {
        area.querySelectorAll('.cat-tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        loadActivity(t.dataset.tab);
      }));
      loadActivity('posts');

      $('signout').addEventListener('click', async (e) => {
        e.preventDefault();
        await sb.auth.signOut();
        location.href = 'index.html';
      });
    }

    render();
  </script>
</body>
</html>
